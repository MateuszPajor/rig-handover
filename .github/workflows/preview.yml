# Plan morning-digest § 3 and § 4 (ADR 0003): a public, short-lived preview of one page.
# Runs rig, saves the page as one HTML file with curl and deploys it to GitHub Pages.
# The file is never committed. The banner marker comes from the repo variable LANE_MARKER:
# set it for the review copy, delete it and run again to upload the clean copy over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: "Night to preview (runs/<night>.jsonl)"
        default: "2026-10-28"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      LANE_MARKER: ${{ vars.LANE_MARKER }}
      PORT: "8787"
      NIGHT: ${{ inputs.night }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: Save the page as one HTML file
        run: |
          [[ "$NIGHT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad night"; exit 1; }
          pnpm start > rig.log 2>&1 &
          for i in $(seq 60); do curl -fs "http://localhost:$PORT/health" > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -fsS "http://localhost:$PORT/digest/$NIGHT" -o _site/index.html
          if [ -n "$LANE_MARKER" ]; then echo "banner: marker set"; else grep -q "no marker set" _site/index.html && echo "banner: no marker set"; fi
          wc -c _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v5
